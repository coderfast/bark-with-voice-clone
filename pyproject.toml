[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "suno-bark"
version = "0.0.1a"
description = "Bark text to audio model"
readme = "README.md"
requires-python = ">=3.8"
authors =  [
    {name = "Suno Inc", email = "hello@suno.ai"},
]
# MIT License
license = {file = "LICENSE.md"}

dependencies = [
    "boto3",
    "encodec",
    "fairseq",
    "funcy",
    "huggingface-hub",
    "matplotlib",
    "numpy",
    "scipy",
    "tokenizers",
    "torch",
    "torchaudio",
    "tqdm",
    "transformers",
]

[project.urls]
source = "https://github.com/suno-ai/bark"

[project.optional-dependencies]
dev = [
    "bandit",
    "black",
    "codecov",
    "flake8",
    "hypothesis>=6.14,<7",
    "isort>=5.0.0,<6",
    "jupyter",
    "mypy",
    "nbconvert",
    "nbformat",
    "pydocstyle",
    "pylint",
    "pytest",
    "pytest-cov",
]
training = [
    "accelerate",
    "bitsandbytes",
    "diffusers",
    "wandb",
]

[tool.setuptools]
packages = ["bark", "hubert", "utils"]

[tool.setuptools.package-data]
bark = ["assets/prompts/*.npz"]

[tool.black]
line-length = 100
